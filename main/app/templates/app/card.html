<article class="hall-card">
    <div class="hall-card__image-wrapper">
        <img src="https://via.placeholder.com/400x250?text=Photo+Studio" 
             alt="Фото зала {{ hall.name }}" 
             width="400" height="250" 
             loading="lazy"
             class="hall-card__img">
    </div>
    
    <div class="hall-card__content">
        <h3 class="hall-card__title">{{ hall.studio.name }} — {{ hall.name }}</h3>
        <p class="hall-card__desc">Вместимость: до {{ hall.capacity }} чел.</p>
        <p class="hall-card__desc">{{ hall.description|default:"Описание скоро появится"|truncatechars:50 }}</p>
        
        <div class="hall-card__footer">
            <span class="hall-card__price">{{ hall.hourly_rate|floatformat:0 }} ₽ <span class="hall-card__price-label">/ час</span></span>
            <a href="{% url 'app:hall' hall.pk %}" class="btn btn--primary hall-card__btn">Забронировать</a>
        </div>
    </div>
</article>
